:root{color-scheme:dark;--bg:#0a0a0b;--surface:#100f12;--line:#26242b;--bone:#f4f1e8;--muted:#a39d92;--gold:#c8aa6e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--bone);font-family:Grotesk,sans-serif;min-height:100svh;display:flex;flex-direction:column}
header,main,footer{width:min(100% - 80px,1152px);margin-inline:auto}
header{padding-block:28px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
.wordmark{font:32px/1 Anton,sans-serif;letter-spacing:-.04em}.wordmark span{color:var(--gold)}
.label{font:11px/1.6 Mono,monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
main{flex:1;display:grid;grid-template-columns:1fr 300px;align-items:center;gap:80px;padding-block:72px}
.eyebrow{color:var(--gold);margin:0 0 22px}
h1{font:clamp(88px,9.5vw,136px)/.98 Anton,sans-serif;letter-spacing:-.035em;margin:0 0 32px;text-transform:uppercase}
h1 span{color:var(--gold)}
.copy{font-size:20px;line-height:1.6;max-width:470px;color:var(--muted);margin:0 0 34px}
a{color:var(--bone);font:12px/1.5 Mono,monospace;letter-spacing:.08em;text-underline-offset:6px;text-decoration-color:var(--gold)}
a:hover{color:var(--gold)}a:focus-visible{outline:2px solid var(--gold);outline-offset:8px}
aside{border-top:2px solid var(--gold);background:var(--surface);padding:28px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
aside .label{margin:0 0 26px}
.status{font:42px/1.1 Anton,sans-serif;letter-spacing:-.015em;margin:0 0 16px}
.reason{color:var(--muted);font-size:15px;line-height:1.7;margin:0}
footer{padding-block:24px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:20px}
footer p{margin:0}
@media(max-width:650px){header,main,footer{width:calc(100% - 40px)}header{padding-block:22px}.label{font-size:10px}main{grid-template-columns:1fr;gap:40px;padding-block:48px}h1{font-size:92px;margin-bottom:24px}.copy{font-size:17px;margin-bottom:28px}.eyebrow{margin-bottom:18px}aside{padding:22px}aside .label{margin-bottom:18px}.status{font-size:32px}footer{flex-direction:column;gap:8px;padding-block:22px}}
</style>
</head>
